<!DOCTYPE html>
<html lang="es" data-skin="clinico" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Meditas">
  <meta name="description" content="Fichas de patologías y procedimientos, repaso diario, evoluciones y calculadoras clínicas.">
  <title>Meditas</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>
    // Aplica el tema guardado antes de pintar, para que no haya un destello de otro color.
    try {
      var u = JSON.parse(localStorage.getItem('meditas-ui') || '{}'), m = u.mode || 'auto';
      if (m === 'auto') m = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.skin = ['cuaderno', 'clinico'].indexOf(u.skin) >= 0 ? u.skin : 'clinico';
      document.documentElement.dataset.mode = m;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Splash: ECG que se dibuja y forma el logo (estilos acá para que aparezca antes que todo) */
    #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: var(--bg, #f3f6f8); transition: opacity .45s ease, visibility .45s; }
    #splash.out { opacity: 0; visibility: hidden; }
    #ecg { width: 100vw; height: 96px; overflow: visible; }
    #ecg-trace { stroke: var(--pri, #0c8587); transition: opacity .45s ease; }
    #ecg-dot { fill: var(--pri, #0c8587); filter: drop-shadow(0 0 4px var(--pri, #0c8587)); transition: opacity .3s; animation: ecg-dot-in .3s ease; }
    @keyframes ecg-dot-in { from { opacity: 0; } to { opacity: 1; } }
    #ecg-box { fill: var(--pri, #0c8587); transform-box: fill-box; transform-origin: center; transform: scale(0); opacity: 0; transition: transform .5s cubic-bezier(.2, .9, .3, 1.2), opacity .3s; }
    #ecg-m { stroke: var(--pri, #0c8587); opacity: 0; transition: stroke .4s ease .1s; }
    #splash.formed #ecg-trace { opacity: 0; }
    #splash.formed #ecg-dot { opacity: 0; }
    #splash.formed #ecg-m { opacity: 1; stroke: var(--pri-ink, #ffffff); }
    #splash.formed #ecg-box { transform: scale(1); opacity: 1; }
    #splash .word { font-family: var(--font-head, 'Inter', system-ui, sans-serif); font-weight: var(--head-w, 700); font-size: 30px; letter-spacing: -.01em; opacity: 0; transform: translateY(8px); transition: opacity .45s ease .15s, transform .45s ease .15s; }
    #splash .word span { color: var(--pri, #0c8587); }
    #splash.formed .word { opacity: 1; transform: none; }
    [data-mode="dark"] #splash { background: var(--bg, #0e1418); }
  </style>
</head>
<body>
  <div id="splash" role="presentation">
    <svg id="ecg" aria-hidden="true"><rect id="ecg-box" width="64" height="64" rx="16"/><path id="ecg-trace" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path id="ecg-m" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle id="ecg-dot" r="2.6"/></svg>
    <div class="word" aria-label="Meditas">Medi<span>tas</span></div>
  </div>
  <script>
    // Animación de entrada: una tira corta de ECG se dibuja a velocidad real, como en un monitor;
    // el complejo central tiene forma de “M” y queda como logo.
    (function () {
      var done, sp = document.getElementById('splash');
      window.__splash = new Promise(function (r) { done = r; });
      var S = 96, k = S / 64, W = Math.max(window.innerWidth || 390, 320) / k, x0 = (W - 64) / 2;
      var svg = document.getElementById('ecg'), tr = document.getElementById('ecg-trace'), m = document.getElementById('ecg-m'), dot = document.getElementById('ecg-dot'), box = document.getElementById('ecg-box');
      svg.setAttribute('viewBox', '0 0 ' + W.toFixed(1) + ' 64');
      box.setAttribute('x', x0.toFixed(1));
      m.setAttribute('d', 'M' + (x0 + 12) + ' 36h8l5-14 7 20 7-20 5 14h8');
      // Tira de ECG que va de un punto a otro: un latido normal (onda P, QRS, onda T) y después el latido con forma de M.
      // Se dibuja como un monitor real: el trazo avanza a velocidad horizontal constante (~70 latidos por minuto),
      // así el QRS aparece casi de golpe y las ondas P y T se ven lentas.
      var BEAT = 86, HR = 70, v = BEAT / (60 / HR); // unidades por segundo
      var xs = Math.max(W * 0.1, x0 - 98), xe = Math.min(W * 0.9, x0 + 84), xb = Math.max(xs + 8, x0 - 86);
      var d = 'M' + xs + ' 36L' + xb + ' 36q4 -7 9 0L' + (xb + 16) + ' 36l2 3 3-25 3 30 2-8L' + (xb + 34) + ' 36q8 -11 16 0'
        + 'L' + (x0 + 1) + ' 36q5 -8 10 0L' + (x0 + 20) + ' 36l5-14 7 20 7-20 5 14L' + (x0 + 55) + ' 36q8 -12 16 0L' + xe + ' 36';
      tr.setAttribute('d', d);
      var L; try { L = tr.getTotalLength(); } catch (e) { L = 0; }
      if (!L) { sp.classList.add('formed'); setTimeout(done, 400); return; }
      tr.style.strokeDasharray = L; tr.style.strokeDashoffset = L;
      // tabla longitud → x, para avanzar por x (como el barrido del monitor) y no por largo del trazo
      var N = 600, LX = [], LL = [];
      for (var i = 0; i <= N; i++) { var l = L * i / N, q = tr.getPointAtLength(l); LL.push(l); LX.push(q.x); }
      function lenAt(x) {
        var lo = 0, hi = N;
        while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (LX[mid] < x) lo = mid; else hi = mid; }
        var span = LX[hi] - LX[lo], f = span > 0 ? (x - LX[lo]) / span : 1;
        return LL[lo] + (LL[hi] - LL[lo]) * Math.max(0, Math.min(1, f));
      }
      function finish() { sp.classList.add('formed'); setTimeout(done, 650); }
      if (!window.requestAnimationFrame) { tr.style.strokeDashoffset = 0; finish(); return; }
      var dur = (xe - xs) / v * 1000, t0 = null;
      dot.setAttribute('cx', xs); dot.setAttribute('cy', 36);
      function step(t) {
        if (t0 === null) t0 = t;
        var p = Math.min((t - t0) / dur, 1), len = p < 1 ? lenAt(xs + (xe - xs) * p) : L;
        tr.style.strokeDashoffset = L - len;
        try { var pt = tr.getPointAtLength(len); dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y); } catch (e) {}
        if (p < 1) requestAnimationFrame(step); else setTimeout(finish, 250);
      }
      setTimeout(function () { requestAnimationFrame(step); }, 350);
    })();
  </script>
  <header class="top" id="top"></header>
  <main id="view" aria-live="polite"></main>
  <nav id="nav" aria-label="Secciones"></nav>
  <button class="fab" id="fab" hidden></button>
  <div class="ov" id="bk" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
